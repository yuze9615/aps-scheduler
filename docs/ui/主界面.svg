<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <!-- 顶栏 -->
  <rect width="900" height="64" fill="#1d4ed8"/>
  <text x="28" y="40" fill="#fff" font-size="22" font-weight="700">宏达精密 · 本地排产助手</text>
  <text x="28" y="56" fill="#c7d2fe" font-size="13">拖入 Excel 台账（订单/设备/工艺路线）→ 一键生成周排单表 + 甘特图 + 风险 + 体检</text>

  <!-- 卡片：上传 -->
  <rect x="28" y="92" width="844" height="150" rx="10" fill="#fff" stroke="#e5e7eb"/>
  <text x="48" y="128" font-size="16" font-weight="700">① 上传台账（空态：未选择文件时）</text>
  <rect x="48" y="142" width="430" height="44" rx="7" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="64" y="170" fill="#9ca3af" font-size="14">未选择文件（.xlsx / .xls）</text>
  <rect x="498" y="142" width="150" height="44" rx="7" fill="#9ca3af"/>
  <text x="540" y="170" fill="#fff" font-size="14">① 上传台账（禁用）</text>
  <rect x="668" y="142" width="160" height="44" rx="7" fill="#e5e7eb"/>
  <text x="700" y="170" fill="#6b7280" font-size="14">② 生成排产（禁用）</text>
  <text x="48" y="220" fill="#6b7280" font-size="13">提示：文件未选中时，上传/生成按钮均为禁用态（灰色），避免误点。</text>

  <!-- 错误态 banner -->
  <rect x="28" y="262" width="844" height="44" rx="7" fill="#fee2e2"/>
  <text x="48" y="290" fill="#b91c1c" font-size="14">⚠ 错误态示例：请先选择一个 .xlsx 台账文件（非 xlsx 上传会返回 400 中文报错，不白屏）</text>

  <!-- 已上传态 -->
  <rect x="28" y="326" width="844" height="120" rx="10" fill="#fff" stroke="#e5e7eb"/>
  <text x="48" y="360" font-size="16" font-weight="700">已上传态（选中文件后）</text>
  <rect x="48" y="374" width="430" height="44" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="64" y="402" fill="#1e40af" font-size="14">已识别 sheet：订单 / 设备 / 工艺路线；行数 {14/12/5}</text>
  <rect x="498" y="374" width="150" height="44" rx="7" fill="#1d4ed8"/>
  <text x="534" y="402" fill="#fff" font-size="14">① 上传台账（可点）</text>
  <rect x="668" y="374" width="160" height="44" rx="7" fill="#1d4ed8"/>
  <text x="700" y="402" fill="#fff" font-size="14">② 生成排产（可点）</text>
  <rect x="48" y="430" width="780" height="6" rx="3" fill="#dcfce7"/>
  <text x="48" y="438" fill="#6b7280" font-size="12">按钮三态统一：禁用(灰) / 可点(蓝) / 进行中(蓝+旋转 spinner)，全站一致。</text>

  <!-- 底部说明 -->
  <rect x="28" y="470" width="844" height="60" rx="10" fill="#f0f4ff" stroke="#c7d2fe"/>
  <text x="48" y="498" fill="#1e40af" font-size="13">主界面交互：选择文件 →「上传台账」→「生成排产」→ 下方依次展示指标卡 / 排单表 / 下载 / 风险 / 体检。</text>
  <text x="48" y="518" fill="#6b7280" font-size="12">空态：未选文件；错误态：非 xlsx / 缺 sheet / 空表，均以中文 banner 提示，绝不白屏。</text>
</svg>
